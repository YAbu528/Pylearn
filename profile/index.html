<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11121b"><title>Profile & Settings · PyLearn</title><link rel="stylesheet" href="../shared/navigation.css"><style>
.profile-card{max-width:680px;margin-top:24px;padding:24px;border:1px solid var(--pl-line);border-radius:18px;background:var(--pl-card)}.profile-field{display:block;margin:16px 0 6px;font-size:13px;font-weight:750}.profile-input{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--pl-line);border-radius:10px;background:var(--pl-bg);color:var(--pl-text);font:inherit}.profile-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.profile-actions button,.profile-actions a{padding:12px 15px;border:0;border-radius:10px;background:#7c3aed;color:#fff;text-decoration:none;font:inherit;font-weight:750}.profile-actions .secondary{background:transparent;border:1px solid var(--pl-line);color:var(--pl-text)}.profile-status{min-height:42px;color:var(--pl-muted);font-size:13px;line-height:1.6}
</style></head><body class="pl-page" data-page="profile"><main class="pl-content"><span class="pl-eyebrow">YOUR ACCOUNT</span><h1 class="pl-page-title">Profile & settings</h1><p class="pl-lead">Manage your PyLearn identity and account session.</p><section class="profile-card"><h2>Profile information</h2><p id="emailText" class="pl-lead">Checking your account…</p><label class="profile-field" for="displayName">Display name</label><input class="profile-input" id="displayName" maxlength="60" placeholder="How should we address you?"><div class="profile-actions"><button id="saveProfile" type="button">Save profile</button><button id="signOut" class="secondary" type="button">Sign out</button></div><p class="profile-status" id="profileStatus" role="status" aria-live="polite"></p></section><section class="profile-card"><h2>Learning shortcuts</h2><div class="profile-actions"><a href="../dashboard/">Dashboard</a><a href="../learn/" class="secondary">Learning path</a></div></section></main>
<script src="../shared/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../shared/session.js"></script><script src="../shared/navigation.js"></script><script>
(()=>{const $=id=>document.getElementById(id);let user=null;const status=t=>$("profileStatus").textContent=t;async function load(next){user=next;if(!user){$("emailText").textContent="You are not signed in."; $("displayName").disabled=true;$("saveProfile").disabled=true;$("signOut").disabled=true;return;} $("emailText").textContent=user.email||"Signed in account";$("displayName").disabled=false;$("saveProfile").disabled=false;$("signOut").disabled=false;try{const profile=await window.PyLearnSession.getProfile();$("displayName").value=profile?.display_name||user.user_metadata?.full_name||"";}catch(e){status("Could not load profile details: "+e.message);}}
window.PyLearnSession.subscribe(load);$("saveProfile").onclick=async()=>{try{await window.PyLearnSession.updateProfile($("displayName").value);status("Profile saved.");}catch(e){status(e.message||"Could not save profile.");}};$("signOut").onclick=async()=>{try{await window.PyLearnSession.signOut();location.href=window.PyLearnConfig.url("welcome");}catch(e){status(e.message);}};
})();
</script></body></html>
