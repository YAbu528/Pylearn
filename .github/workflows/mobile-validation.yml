name: PyLearn mobile validation

on:
  push:
    branches:
      - mobile/expo-foundation
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylearn-mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, validate, and build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Expo configuration and dependencies
        run: npx --yes expo-doctor

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pylearn-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
