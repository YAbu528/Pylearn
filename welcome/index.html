<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11121b"><title>Sign in · PyLearn</title><link rel="stylesheet" href="../shared/navigation.css">
<style>
.auth-wrap{max-width:520px;margin:0 auto}.auth-card{margin-top:25px;padding:clamp(20px,5vw,32px);border:1px solid var(--pl-line);border-radius:20px;background:var(--pl-card)}.auth-tabs{display:flex;gap:8px;margin:20px 0}.auth-tabs button,.auth-submit,.provider{padding:12px;border:1px solid var(--pl-line);border-radius:11px;background:transparent;color:var(--pl-text);font:inherit;font-weight:750}.auth-tabs button.active,.auth-submit{background:var(--pl-accent);color:white;border-color:var(--pl-accent)}.auth-field{display:block;margin:14px 0 6px;font-size:13px;font-weight:750}.auth-input{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--pl-line);border-radius:10px;background:var(--pl-bg);color:var(--pl-text);font:inherit}.auth-submit,.provider{width:100%;margin-top:13px;cursor:pointer}.provider{display:flex;align-items:center;justify-content:center;gap:10px}.provider img{width:19px;height:19px}.auth-divider{text-align:center;color:var(--pl-muted);font-size:12px;margin:18px 0}.auth-status{min-height:42px;color:var(--pl-muted);font-size:13px;line-height:1.6}.auth-note{color:var(--pl-muted);font-size:12px;line-height:1.6}
</style></head>
<body class="pl-page" data-page="welcome"><main class="pl-content auth-wrap"><span class="pl-eyebrow">WELCOME TO PYLEARN</span><h1 class="pl-page-title">Your learning, saved.</h1><p class="pl-lead">Sign in to keep your Python progress, notes, bookmarks and achievements connected across devices.</p>
<section class="auth-card"><div class="auth-tabs"><button id="signinTab" class="active" type="button">Sign in</button><button id="signupTab" type="button">Create account</button></div>
<form id="authForm"><label class="auth-field" for="email">Email address</label><input class="auth-input" id="email" type="email" autocomplete="email" required><label class="auth-field" for="password">Password</label><input class="auth-input" id="password" type="password" autocomplete="current-password" minlength="8" required><button class="auth-submit" id="submitAuth" type="submit">Sign in</button></form>
<button id="forgotPassword" class="provider" type="button">Forgot password?</button><div class="auth-divider">OR CONTINUE WITH</div>
<button class="provider" id="google" type="button"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Continue with Google</button>
<button class="provider" id="microsoft" type="button"><img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="">Continue with Microsoft</button>
<p class="auth-status" id="authStatus" role="status" aria-live="polite"></p><p class="auth-note">By creating an account, you can sync your learning across supported browsers and devices. Email confirmation may be required.</p></section></main>
<script src="../shared/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../shared/session.js"></script><script src="../shared/navigation.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id);let mode="signin";const status=t=>$("authStatus").textContent=t;
function setMode(next){mode=next;$("signinTab").classList.toggle("active",mode==="signin");$("signupTab").classList.toggle("active",mode==="signup");$("submitAuth").textContent=mode==="signin"?"Sign in":"Create account";$("password").autocomplete=mode==="signin"?"current-password":"new-password";$("forgotPassword").hidden=mode!=="signin";}
$("signinTab").onclick=()=>setMode("signin");$("signupTab").onclick=()=>setMode("signup");
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("submitAuth").disabled=true;status("Working…");try{const email=$("email").value.trim(),password=$("password").value;const result=mode==="signin"?await window.PyLearnSession.signIn(email,password):await window.PyLearnSession.signUp(email,password);if(result.session){location.href=window.PyLearnConfig.url("dashboard");}else status(mode==="signup"?"Account created. Check your email for the confirmation link.":"Sign-in link or confirmation may still be required.");}catch(err){status(err.message||"Authentication failed.");}finally{$("submitAuth").disabled=false;}});
$("google").onclick=async()=>{try{status("Opening Google sign-in…");await window.PyLearnSession.signInWithProvider("google");}catch(e){status(e.message);}};
$("microsoft").onclick=async()=>{try{status("Opening Microsoft sign-in…");await window.PyLearnSession.signInWithProvider("azure");}catch(e){status(e.message);}};
$("forgotPassword").onclick=async()=>{const email=$("email").value.trim();if(!email){status("Enter your email address first.");return;}try{await window.PyLearnSession.resetPassword(email);status("If an account exists for that address, a password-reset email has been sent.");}catch(e){status(e.message);}};
window.PyLearnSession.ready.then(user=>{if(user)status("You are already signed in. Open your dashboard or profile.");});
})();
</script></body></html>
